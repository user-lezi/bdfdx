<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>API Playground</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="style.css" />
    <!-- Tailwind CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="flex items-center justify-center p-6 text-white scrollbar-hide">
    <div id="endpoint-list">
      <h1 class="text-lg font-semibold mb-2">Endpoints</h1>
      <div id="endpoint-list" class="space-y-2"></div>
    </div>

    <!-- Main panel -->
    <div
      id="endpoint-view"
      class="hidden h-full bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-6 overflow-y-auto scrollbar-hide"
    ></div>
    <!-- Template for endpoint view -->
    <template id="opened-endpoint-template">
      <header class="px-4 py-1.5 border-b-3 border-white/12 mb-4">
        <p
          id="summary"
          class="text-2xl text-white/60 m-2 capitalize underline text-heading"
        ></p>
        <p id="description" class="text-sm text-white/60"></p>
      </header>
      <div class="relative">
        <input
          type="text"
          id="display-url"
          class="bg-black/40 text-white/40 border b-2 hover:border-[rgba(var(--accent-rgb),0.4)] text-sm rounded-md font-mono focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
          disabled
        />
        <button
          id="copy-url-btn"
          type="button"
          class="absolute end-1.5 bottom-1.5 text-white bg-[rgba(var(--accent-rgb), 0.8)] hover:bg-[rgba(var(--accent-rgb), 1)] border border-transparent focus:ring-1.5 focus:ring-[rgba(var(--accent-rgb), 0.8)] shadow-xs font-medium leading-5 rounded text-xs px-3 py-1.5 focus:outline-none"
        >
          Copy
        </button>
      </div>
      <!-- Params -->
      <form
        id="params-form"
        class="hidden my-3 p-3 bg-black/20 outline-1 outline-[rgb(var(--accent-rgb))]/40 w-full rounded-md"
      >
        <p class="text-xl text-center heading text-white/90">URL Parameters</p>
      </form>
      <!-- Query -->
      <form
        id="query-form"
        class="hidden my-3 p-3 bg-black/20 outline-1 outline-[rgb(var(--accent-rgb))]/40 w-full rounded-md"
      >
        <p class="text-xl text-center heading text-white/90">URL Query</p>
      </form>
      <!-- JSON -->
      <form
        id="body-form"
        class="hidden my-3 p-3 bg-black/20 outline-1 outline-[rgb(var(--accent-rgb))]/40 w-full rounded-md"
      >
        <p class="text-xl text-center heading text-white/90">JSON Body</p>
      </form>

      <button
        id="make-request-btn"
        class="mt-3 px-3 py-1 rounded-sm bg-[rgb(var(--accent-rgb))]/80 hover:bg-[rgb(var(--accent-rgb))] hover:-translate-y-1/7 hover:scale-105 transition min-w-full"
      >
        Send request
      </button>
      <div id="response-box" class="hidden mt-6">
        <div class="text-xs text-white/60 mb-1">Response</div>
        <pre
          id="response-output"
          class="bg-black/40 border border-white/15 rounded-lg p-4 text-sm font-mono overflow-auto max-h-96"
        ></pre>
      </div>

      <button
        id="endpoint-back-btn"
        class="mt-3 px-3 py-1 rounded-md bg-white/10 hover:bg-white/20 transition"
      >
        ← Back
      </button>
    </template>

    <script src="./api-playground.js"></script>
  </body>
</html>
